<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Piano</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Henny+Penny&display=swap" rel="stylesheet">
         
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Birthstone&family=Encode+Sans+Expanded:wght@100;200;300;400;500;600;700;800;900&family=Henny+Penny&family=Kranky&family=Smokum&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./style.css">
    </head>

    <body>

        <div class="piano-container">
            <h1>My Piano D</h1>
            

            <div class="key-wrapper">

                <button class="key w-key z" id="C4"><p>C4</p></button>
                <button class="key w-key x" id="D4"><p>D4</p></button>
                <button class="key w-key c" id="E4"><p>E4</p></button>
                <button class="key w-key v" id="F4"><p>F4</p></button>
                <button class="key w-key b" id="G4"><p>G4</p></button>
                <button class="key w-key n" id="A4"><p>A4</p></button>
                <button class="key w-key m" id="B4"><p>B4</p></button>
                <button class="key w-key q" id="C5"><p>C5</p></button>
                <button class="key w-key w" id="D5"><p>D5</p></button>
                <button class="key w-key e" id="E5"><p>E5</p></button>
                <button class="key w-key r" id="F5"><p>F5</p></button>
                <button class="key w-key t" id="G5"><p>G5</p></button>
                <button class="key w-key y" id="A5"><p>A5</p></button>
                <button class="key w-key u" id="B5"><p>B5</p></button>
                 
                <button class="key b-key s" id="Cs4">Cs4</button>
                <button class="key b-key d" id="Ds4">Ds4</button>
                <button class="key b-key g" id="Fs4">Fs4</button>
                <button class="key b-key h" id="Gs4">Gs4</button>
                <button class="key b-key j" id="As4">As4</button>
                <button class="key b-key b2" id="Cs5">Cs5</button>
                <button class="key b-key b3" id="Ds5">Ds5</button>
                <button class="key b-key b5" id="Fs5">Fs5</button>
                <button class="key b-key b6" id="Gs5">Gs5</button>
                <button class="key b-key b7" id="As5">As5</button>

            </div>

            <footer>
                <p id="ftr">© 2026 Dasun</p>
            </footer>

            

        </div>


         
        <script src="./script.js"></script>
    </body>
</html>
