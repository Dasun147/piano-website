<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Piano</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Henny+Penny&display=swap" rel="stylesheet">
         
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Birthstone&family=Encode+Sans+Expanded:wght@100;200;300;400;500;600;700;800;900&family=Henny+Penny&family=Kranky&family=Smokum&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./style.css">
    </head>

    <body>

        <div class="piano-container">
            
            <h1>My Piano D</h1>
            
            <div class="options">
            <button class="naming"></button>   
            <button class="colorProfile" id="cpBtn1"></button>
            <button class="colorProfile" id="cpBtn2"></button>
            <button class="colorProfile" id="cpBtn3"></button>
         
            </div>
            <div class="key-wrapper">

                <button class="key w-key z" id="C4"><p class="name" id="nameW">C4</p></button>
                <button class="key w-key x" id="D4"><p class="name" id="nameW">D4</p></button>
                <button class="key w-key c" id="E4"><p class="name" id="nameW">E4</p></button>
                <button class="key w-key v" id="F4"><p class="name" id="nameW">F4</p></button>
                <button class="key w-key b" id="G4"><p class="name" id="nameW">G4</p></button>
                <button class="key w-key n" id="A4"><p class="name" id="nameW">A4</p></button>
                <button class="key w-key m" id="B4"><p class="name" id="nameW">B4</p></button>
                <button class="key w-key q" id="C5"><p class="name" id="nameW">C5</p></button>
                <button class="key w-key w" id="D5"><p class="name" id="nameW">D5</p></button>
                <button class="key w-key e" id="E5"><p class="name" id="nameW">E5</p></button>
                <button class="key w-key r" id="F5"><p class="name" id="nameW">F5</p></button>
                <button class="key w-key t" id="G5"><p class="name" id="nameW">G5</p></button>
                <button class="key w-key y" id="A5"><p class="name" id="nameW">A5</p></button>
                <button class="key w-key u" id="B5"><p class="name" id="nameW">B5</p></button>
                 
                <button class="key b-key s" id="Cs4"><p class="name" id="nameB">Cs4</p></button>
                <button class="key b-key d" id="Ds4"><p class="name" id="nameB">Ds4</p></button>
                <button class="key b-key g" id="Fs4"><p class="name" id="nameB">Fs4</p></button>
                <button class="key b-key h" id="Gs4"><p class="name" id="nameB">Gs4</p></button>
                <button class="key b-key j" id="As4"><p class="name" id="nameB">As4</p></button>
                <button class="key b-key b2" id="Cs5"><p class="name" id="nameB">Cs5</p></button>
                <button class="key b-key b3" id="Ds5"><p class="name" id="nameB">Ds5</p></button>
                <button class="key b-key b5" id="Fs5"><p class="name" id="nameB">Fs5</p></button>
                <button class="key b-key b6" id="Gs5"><p class="name" id="nameB">Gs5</p></button>
                <button class="key b-key b7" id="As5"><p class="name" id="nameB">As5</p></button>

            </div>

            <footer>
                <p id="ftr">© 2026 Dasun</p>
            </footer>

            

        </div>


         
        <script src="./script.js"></script>
    </body>
</html>
