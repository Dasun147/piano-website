<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>My Piano D</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Smythe&display=swap" rel="stylesheet">
       
        <link rel="stylesheet" href="./style.css">
    </head>

    <body>

        <div class="piano-container">
            
            <h1>My Piano D</h1>
            
            <div class="options">
            <button class="naming"></button>   
            <button class="colorProfile" id="cpBtn1"></button>
            <button class="colorProfile" id="cpBtn2"></button>
            <button class="colorProfile" id="cpBtn3"></button>
         
            </div>
            <div class="key-wrapper">

                <button class="key w-key z" id="C4"><p class="name" id="nameW">z</p></button>
                <button class="key w-key x" id="D4"><p class="name" id="nameW">x</p></button>
                <button class="key w-key c" id="E4"><p class="name" id="nameW">c</p></button>
                <button class="key w-key v" id="F4"><p class="name" id="nameW">v</p></button>
                <button class="key w-key b" id="G4"><p class="name" id="nameW">b</p></button>
                <button class="key w-key n" id="A4"><p class="name" id="nameW">n</p></button>
                <button class="key w-key m" id="B4"><p class="name" id="nameW">m</p></button>
                <button class="key w-key q" id="C5"><p class="name" id="nameW">q</p></button>
                <button class="key w-key w" id="D5"><p class="name" id="nameW">w</p></button>
                <button class="key w-key e" id="E5"><p class="name" id="nameW">e</p></button>
                <button class="key w-key r" id="F5"><p class="name" id="nameW">r</p></button>
                <button class="key w-key t" id="G5"><p class="name" id="nameW">t</p></button>
                <button class="key w-key y" id="A5"><p class="name" id="nameW">y</p></button>
                <button class="key w-key u" id="B5"><p class="name" id="nameW">u</p></button>
                 
                <button class="key b-key s" id="Cs4"><p class="name" id="nameB">s</p></button>
                <button class="key b-key d" id="Ds4"><p class="name" id="nameB">d</p></button>
                <button class="key b-key g" id="Fs4"><p class="name" id="nameB">g</p></button>
                <button class="key b-key h" id="Gs4"><p class="name" id="nameB">h</p></button>
                <button class="key b-key j" id="As4"><p class="name" id="nameB">j</p></button>
                <button class="key b-key b2" id="Cs5"><p class="name" id="nameB">2</p></button>
                <button class="key b-key b3" id="Ds5"><p class="name" id="nameB">3</p></button>
                <button class="key b-key b5" id="Fs5"><p class="name" id="nameB">5</p></button>
                <button class="key b-key b6" id="Gs5"><p class="name" id="nameB">6</p></button>
                <button class="key b-key b7" id="As5"><p class="name" id="nameB">7</p></button>

            </div>

            <footer>
                <p id="ftr">© 2026 Dasun</p>
            </footer>

            

        </div>


         
        <script src="./script.js"></script>
    </body>
</html>
